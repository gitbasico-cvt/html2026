<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Consumo de API - ViaCEP</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Teste de API REST</h1>
            <p>Consumindo o ViaCEP e inspecionando o JSON</p>
        </header>

        <main>
            <section>
                <h2>Busca de Endereço</h2>
                <p>Digite um CEP válido para consultar a API:</p>
            </section>

            <section>
                <div style="margin-bottom: 15px;">
                    <label>CEP (somente números):</label><br>
                    <input type="text" id="input-cep" placeholder="Ex: 49030000" maxlength="8" style="padding: 8px; width: 100%; margin-top: 5px; box-sizing: border-box;">
                </div>
                <div>
                    <button id="btn-buscar" style="padding: 10px 15px; background-color: #1e1e1e; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Consultar API</button>
                </div>
            </section>

            <!-- Área onde o resultado formatado será exibido -->
            <section id="resultado-api" style="margin-top: 20px;">
                <!-- O resultado aparece aqui -->
            </section>

            <!-- NOVA ÁREA: Para exibir o JSON cru recebido do servidor -->
            <section style="margin-top: 20px;">
                <h3>Dados brutos recebidos (Formato JSON):</h3>
                <pre id="json-bruto" style="background-color: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px;">Aguardando consulta...</pre>
            </section>
        </main>

        <footer>
            <a href="index.html">← Voltar para o menu principal</a>
        </footer>
    </div>

    <script src="js/api-teste.js"></script>
</body>
</html>
