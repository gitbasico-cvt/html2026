<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque Fácil - Atualizar Produto</title>   
</head>
<body>

    <header>
        <h1>Estoque Fácil</h1>
        <p>Sistema de controle de estoque</p>
    </header>

    <main>
        <section>
            <h2>Atualizar produto</h2>
            <p>Alterar informações de um produto.</p>
        </section>

        <section>
            <form>
                <div style="margin-bottom: 15px;">
                    <label>ID ou Código do produto:</label><br>
                    <input type="text" placeholder="Digite o código" style="padding: 8px; width: 100%; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Nova quantidade ou novo preço:</label><br>
                    <input type="text" placeholder="Atualize o dado necessário" style="padding: 8px; width: 100%; margin-top: 5px;">
                </div>
                <div>
                    <button type="submit" style="padding: 10px 15px; background-color: #1e1e1e; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Atualizar informações</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <a href="index.html">← Voltar para o menu principal</a>
    </footer>

</body>
</html>
