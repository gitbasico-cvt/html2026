<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Cadastrar Produto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main>
            <section>
                <h2>Cadastrar produto</h2>
                <p>Adicionar um novo produto.</p>
            </section>

            <section>
                <form>
                    <div style="margin-bottom: 15px;">
                        <label>Nome do produto:</label><br>
                        <input type="text" placeholder="Digite o nome" style="padding: 8px; width: 100%; margin-top: 5px; box-sizing: border-box;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label>Quantidade:</label><br>
                        <input type="number" placeholder="Digite a quantidade" style="padding: 8px; width: 100%; margin-top: 5px; box-sizing: border-box;">
                    </div>
                    <div>
                        <button type="submit" style="padding: 10px 15px; background-color: #1e1e1e; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Salvar produto</button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <a href="index.html">← Voltar para o menu principal</a>
        </footer>
    </div>

    <!-- Ligação com o arquivo JavaScript externo -->
    <script src="js/script.js"></script>
</body>
</html>
