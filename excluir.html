<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque Fácil - Excluir Produto</title>   
<body>

    <header>
        <h1>Estoque Fácil</h1>
        <p>Sistema de controle de estoque</p>
    </header>

    <main>
        <section>
            <h2>Excluir produto</h2>
            <p>Remover um produto do sistema.</p>
        </section>

        <section>
            <form>
                <div style="margin-bottom: 15px;">
                    <label>Informe o código do produto que deseja remover:</label><br>
                    <input type="text" placeholder="Código do produto" style="padding: 8px; width: 100%; margin-top: 5px;">
                </div>
                <div>
                    <button type="submit" style="padding: 10px 15px; background-color: #d9534f; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Confirmar exclusão</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <a href="index.html">← Voltar para o menu principal</a>
    </footer>

</body>
</html>
